name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Build Native ML-KEM-768 Library
        run: |
          make -C firmware/components/mlkem768

      - name: Syntax check Python sources
        run: |
          python -m compileall -q server tests tools benchmarks

      - name: Verify archived campaign statistics
        run: python tools/analyze_submission.py --check

      - name: Exercise benchmark failure accounting on host
        run: python tools/test_benchmark_host.py

      - name: Run Cryptographic Unit Tests
        run: |
          python -m unittest discover -s tests

      - name: Run ML-KEM-768 self-consistency tests
        run: |
          python tools/test_mlkem768_kat.py

      - name: Validate JSON data files
        run: |
          python - <<'PY'
          import json, pathlib, sys
          for p in pathlib.Path(".").rglob("*.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Invalid JSON: {p}: {e}")
                  sys.exit(1)
          print("OK")
          PY

  firmware-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware with recorded ESP-IDF version
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py build
          idf.py --version > build/build-identity.txt
          git rev-parse HEAD >> build/build-identity.txt
          xtensa-esp32-elf-gcc --version >> build/build-identity.txt
          sha256sum build/*.elf build/*.bin build/*.map sdkconfig >> build/build-identity.txt
      - name: Preserve compiler outputs (not hardware execution evidence)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-idf55-build-${{ github.sha }}
          path: |
            firmware/build/*.elf
            firmware/build/*.bin
            firmware/build/*.map
            firmware/build/build-identity.txt
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/sdkconfig
