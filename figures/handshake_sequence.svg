   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(57.369375 387.00925)">One application key-exchange request/response; TCP setup is separate.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(41.159375 396.611437)">No Finished flight; telemetry shares one key across directions and uses no AAD.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(32.536875 406.213625)">Rotate after 50 successful responses; three consecutive errors also end the session.</text>
